# ============================================================================
# 🛡️ WATCHDOG — session-level circuit breaker (2026-05-20)
# ============================================================================
# Trips on ANY of: loss cap exceeded, session duration elapsed, trade count
# cap hit, max session deploy exceeded. On trip, the executor refuses new
# buys (HALT). Open positions are NOT force-closed (v1 default 'hold').
[watchdog]
enabled = true
loss_cap_sol = -0.145             # 🔒 2026-05-22 15:45 Mamba: HARD FLOOR $100 bankroll. Anchor $112.66 - $12.66 max loss = $100 floor. At ~$87/SOL, $12.66 = 0.145 SOL. Bot HALTS new buys when realized PnL drops below this (current realized -$4.91, ~$7.66 of room left).
session_duration_secs = 28800     # 8h session window
trade_count_cap = 20              # trip after 20 executed buys (unchanged)
max_session_deploy_sol = 2.0      # 🔧 2026-05-22 18:39 Mamba: raised 0.6→2.0. Was limiting WINNING sessions — we hit cap at 4 trades when up \$15. Loss cap (-0.145 SOL) still protects from actual bleed.
on_trip_action = "hold"           # 'hold' = stop new buys, keep open positions
daily_floor_usd = 70.0            # 🔒 2026-05-22 18:24 Mamba: PERSISTENT DAILY FLOOR. Bot REFUSES TO START if (trading+vault) < \$70 total. Survives restarts; can't be bypassed by reset. Currently at ~\$84 → \$14 of runway before hard daily stop.
