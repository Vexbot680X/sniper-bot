# ============================================================================
# 🛡️ WATCHDOG — session-level circuit breaker (2026-05-20)
# ============================================================================
# Trips on ANY of: loss cap exceeded, session duration elapsed, trade count
# cap hit, max session deploy exceeded. On trip, the executor refuses new
# buys (HALT). Open positions are NOT force-closed (v1 default 'hold').
[watchdog]
enabled = true
loss_cap_sol = -0.02              # trip when realized PnL drops below this
session_duration_secs = 7200      # 2h session window
trade_count_cap = 20              # trip after 20 executed buys
max_session_deploy_sol = 0.06     # trip when cumulative deploy exceeds this
on_trip_action = "hold"           # 'hold' = stop new buys, keep open positions
