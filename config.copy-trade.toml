# ============================================================================
# COPY-TRADE V1 — LOCKED 2026-05-20
# ============================================================================
# ⚠️ DO NOT START WITHOUT MAMBA APPROVAL
# ----------------------------------------------------------------------------
# 15 finalist wallets (from memory/wallet-validated.md). Locked v1 params:
#   Min entry:       0.02 SOL  (position_size_sol)
#   Take profit:     +30%      (take_profit_pct)
#   Stop loss:       −10%      (stop_loss_pct)
#   Timeout exit:    NONE      (max_hold_seconds = 0 → disabled)
#   Max concurrent:  3 positions (0.06 SOL deployed on 0.1 SOL bankroll)
#   Exit triggers:   TP, SL, or source-wallet sell (no time-based exit)
#   Hype gate:       observe-only (logs PASS/FAIL, never blocks v1)
# ----------------------------------------------------------------------------
[trading]
mode = "live"                    # 🔴 LIVE 2026-05-22 12:30 UTC by Mamba — Theo-only, 0.2 SOL/trade, watchdog -0.3 SOL loss cap
copy_trade_only = true           # 🚫 2026-05-22 14:48 UTC — Mamba: COPY-TRADE ONLY. Reject all sniper/scanner/mcap-watcher/trending-poller auto-entries.
# Live execution requires SNIPER_WALLET_PATH (default ~/.openclaw/workspace/secrets/sniper-bot-wallet.json)
# and VAULT_WALLET_PATH (default ~/.openclaw/workspace/secrets/vault-wallet.json) plus HELIUS_API_KEY env vars.
# DO NOT flip to live without reviewing LIVE_BUILD_REPORT.md and dust-testing first.
starting_bankroll_usd = 30.31    # v2 launch
# LIVE-mode tx params (ignored in paper mode):
slippage_bps = 2000             # v2 Mamba — 20% (mid of 10-25% range)
priority_fee_percentile = 75    # 75th percentile of recent priority fees

# 🚀 LATENCY (2026-05-13): tx send/confirm tuning. Replaces the old
# `send_and_confirm_transaction_with_spinner` path (~30s default timeout,
# 500ms polls, RPC-side retries). New path: skip_preflight=true + max_retries=0,
# custom poll loop on get_signature_statuses every confirm_poll_interval_ms.
confirm_timeout_secs = 20         # declare send failed after this many seconds without confirmation
confirm_poll_interval_ms = 400    # how often to ask the RPC if our tx confirmed

# 🛡️ STALE-CURVE GUARD (2026-05-13): max ms between WS receive time and
# the buy decision. If our handler queue lagged longer than this, the
# curve depth in the NewToken event is no longer trustworthy and we refuse
# the entry. Set to 0 to disable.
max_curve_age_ms = 1500
# Fixed position size in SOL. Always sized at this many SOL converted to USD
# at decision time using current sol_usd. When > 0, overrides position_size_pct.
# 🔒 COPY-TRADE V1 LOCKED PARAMS (Mamba, 2026-05-20 — MEMORY.md):
#   position_size_sol = 0.02   → min entry
#   take_profit_pct   = 30.0
#   stop_loss_pct     = 10.0
#   max_concurrent    = 3      → 0.06 SOL deployed on 0.1 SOL bankroll
#   max_hold_seconds  = 0      → no timeout (exit only on TP / SL / source-sell)
position_size_sol = 0.15         # 🔧 2026-05-22 17:12 Mamba: 0.1 → 0.15. Mid-step between safe (0.1) and Theo-median (0.2). ~\$13/trade.
position_size_pct = 0.0         # legacy %-of-bankroll, disabled when position_size_sol > 0

# 🛑 LIVE-MODE HARD CAP (SOL). Independent belt-and-suspenders ceiling.
# The bot refuses any LIVE buy that would exceed this many SOL, regardless of
# what position_size_sol or any other math says. Paper mode ignores this.
live_max_position_sol = 0.15  # 🔧 2026-05-22 17:12 — paired with position_size_sol
take_profit_pct = 50.0           # 🔧 2026-05-22 17:22 Mamba: +30 → +50. Give Theo's moves more room before we cap upside.
stop_loss_pct = 200.0            # 🔧 2026-05-22 17:50 Mamba: SL REMOVED. Formula is entry*(1 - sl_pct/100) so 200 → entry*(-1) = unreachable negative price. Effectively disabled. Exit only on +50% TP / source-sell / rug (mcap<\$2500 after 5s grace).
max_concurrent_positions = 3     # 🔒 v1 locked — 3 slots × 0.02 SOL = 0.06 SOL of 0.1 SOL bankroll
max_hold_seconds = 0             # 🔒 v1 locked — 0 = NO TIMEOUT (exit only on TP/SL/source-sell)
# Rug exit: if open position's mcap collapses below this, force-close.
# USD-denominated takes precedence when > 0; bot converts to SOL at decision time.
rug_exit_mcap_usd = 2500.0       # 🔧 2026-05-22 15:42 Mamba: lowered 7500→2500. Pump.fun coins launch at $3-4k mcap; $7500 floor force-exited copy-trades instantly. $2500 = true rug threshold (curve drained below launch). NOTE: rug-watcher in daemon also has a >=5s grace period after entry to avoid insta-exits.
rug_exit_mcap_sol = 0.0         # legacy SOL floor, disabled when rug_exit_mcap_usd > 0

# 🛡️ SAFETY (Phase 3.Safety.1): book↔chain reconciliation guard.
# Refuses live startup if state.json book total disagrees with on-chain
# balance by more than `reconciliation_tolerance_pct`. Auto-skipped on
# paper mode, fresh state, or when open positions exist.
reconciliation_required = true
reconciliation_tolerance_pct = 0.05    # 5%

# 🛡️ FEATURE (Phase 3.Feature.1): pre-buy exit-slippage gate.
# Estimates the slippage of selling our position back into the CURRENT
# curve depth (worst-realistic-exit model). Refuses entries where the
# estimate exceeds the threshold. Closes the JOHNPORK-style failure.
pre_buy_slippage_required = false      # 🔧 2026-05-22 Mamba: disabled for copy-trade. Theo enters at whatever curve depth; we mirror at slightly worse depth. Refusing on slippage misses every real signal.
pre_buy_slippage_threshold_pct = 0.10  # legacy — ignored when pre_buy_slippage_required=false
pre_buy_fee_bps_per_side = 100         # pump.fun documented swap fee

# 🛡️ FEATURE (Phase 3.Feature.2): scale-out exits.
# Every LIVE exit (TP/SL/timeout/rug/forced) is sold in N tranches with
# a delay between each, instead of one big market sell. Reduces aggregate
# exit slippage by ~40-60% at our band-scalp depth range. Each tranche
# reads current balance so partial fills self-correct.
scale_out_enabled = false        # 🐍 disabled — broke on Comrade exit
scale_out_tranches = 3
scale_out_delay_ms = 500

# 🛡️ FEATURE (Phase 3.Feature.3): pre-buy dev vetting.
# Every NewToken event is recorded against its dev pubkey. At entry time:
#   - If dev is on `dev_blacklist`, refuse immediately (manual operator flag).
#   - If dev has launched > N distinct tokens in the last 24h, refuse
#     (overwhelmingly likely serial rugger).
# Cheapest filter we run — one indexed-table query per token.
dev_vetting_required = true
dev_vetting_max_launches_24h = 10  # 🐍 loosened from 3 to catch more trending

# 🛡️ FEATURE (Phase 3.Feature.5): dev wallet WS rug-watcher.
# Every open live position subscribes its dev_pubkey to a Helius logsSubscribe
# stream. Any tx the dev signs that touches the pump.fun program triggers a
# DevDumpAlert. With alert_only=true, alerts are telegrammed but no auto-exit.
# With alert_only=false, alerts queue the position for emergency exit
# (bypassing TP/SL/timeout) with exit_reason="dev_dump_detected".
#
# rug_watcher_alert_only = true (DEFAULT for Phase B initial validation)
# Flip to false only after measuring false-positive rate on real data.
rug_watcher_enabled = true
rug_watcher_alert_only = false  # 🔑 LIVE 2026-05-12 15:37 — AUTO-EXIT enabled (THE KILLER FEATURE). After ASST rug trade caught at 170ms in alert-only mode, Mamba flipped this to auto-sell on dev dump.

# 🧠 LEARNING (Phase 4): dev-reputation entry gate.
# Every trade close updates a cached score per dev_pubkey in the dev_reputation
# table (Wilson lower bound on win-rate, modulated by avg PnL%; hard floor at
# -1.0 if rug exits >= 50% of trades). Range [-1.0, +1.0]; NULL when the dev
# has fewer than 3 trades against us (treated as "unknown / always allowed").
#
# OBSERVE-ONLY by default: scores accumulate silently so we can verify they
# predict outcomes BEFORE we let them block trades. Flip dev_reputation_enabled
# to true once we have ~30+ scored devs and Mamba+Vex have reviewed the data.
dev_reputation_enabled = false
dev_reputation_refuse_below = -0.3  # range -1.0..+1.0; -0.3 = block proven-bad devs only

[skim]
# Continuous profit skim: on every winning close, move skim_pct of the realized
# gain to a sidelined `vault_usd` balance. Vault is one-way — never withdrawn back
# into trading bankroll. Telegram alerts on each skim and on bankroll depletion.
enabled = true
skim_pct = 50.0
# Alert when trading bankroll < (depletion_concurrent_floor * position_size_sol * sol_usd).
# E.g. 5 → alert when bankroll can't fill all 5 concurrent slots.
depletion_concurrent_floor = 5.0

[scanner]
scan_interval_seconds = 10
position_check_interval_seconds = 2     # 🔒 STRATEGY v3 2026-05-10 17:51 UTC — 5x faster polling (was 10s). Critical for catching exits before crowd.
heartbeat_interval_seconds = 300

[filters]
# Sanity filters on pump.fun firehose.
# Pump.fun launches all start with ~30 SOL virtual liquidity, so liquidity is
# meaningless at launch — market cap is the real selectivity lever.
# Graduation to Raydium happens ~460 SOL mcap (~$69k). Tier guide:
#   50  SOL  (~$7.5k)  — early but filters deadest launches
#   200 SOL  (~$30k)   — proven momentum, halfway to graduation
#   460 SOL  (~$69k)   — graduation candidates only
# Mcap floor: USD-denominated takes precedence when set; bot converts to SOL
# at decision time using current sol_usd — always self-consistent.
min_market_cap_usd = 15000.0      # v2 Mamba spec
max_market_cap_usd = 200000.0     # v2 Mamba spec
min_market_cap_sol = 0.0        # legacy SOL floor, disabled when min_market_cap_usd > 0
require_mint_renounced = true
require_no_freeze_authority = true
max_top10_holder_pct = 80.0
min_token_age_seconds = 0       # 0 = brand new ok
max_token_age_seconds = 180     # extended from 60 → 180s on 2026-05-10 17:32 UTC. Strategy experiment: wider window to include tokens that survived first minute (more proven, less rug risk). Paper data was 0-60s only — this is uncharted.

# Mayhem mode = pump.fun's optional 24h AI-driven market-maker mode (doubles
# supply to 2B, AI agent randomly buys/sells the other 1B). Volatile, unpredictable,
# not a fit for our 5min strategy. PumpPortal WS event has `is_mayhem_mode` flag
# that we check directly.
reject_mayhem_mode = true        # 🔒 LIVE BOT RULES — skip mayhem-mode launches

[rpc]
# Endpoint resolved at runtime by src/rpc.rs:
#  1. If HELIUS_API_KEY env var is set, that key is used (preferred).
#  2. Otherwise, if this string contains "api-key=..." and not "PUBLIC",
#     it's used verbatim (local-only override).
#  3. Otherwise, falls back to public mainnet RPC (logs a warning).
# Keep the literal "PUBLIC" placeholder here so secrets never enter git history.
# Set HELIUS_API_KEY in `secrets.env` for live operation.
helius_endpoint = "https://mainnet.helius-rpc.com/?api-key=PUBLIC"
jupiter_quote_url = "https://lite-api.jup.ag/swap/v1/quote"  # updated 2026-05-10 — old quote-api.jup.ag/v6/quote returns HTTP 000, Jupiter migrated to lite-api.jup.ag/swap/v1. Was silently falling back to $90 SOL_USD const.
pumpportal_ws = "wss://pumpportal.fun/api/data"

[telegram]
# Set via env vars: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
enabled = true

# ⚡ Jito Block Engine integration. When enabled, every live tx is also
# submitted to Jito as a [tip_tx, trade_tx] bundle in parallel with the
# regular Helius submission. Solana dedups by signature — only one inclusion
# can land. If Jito wins (typically faster), the tip is paid; if Helius wins,
# the bundle is rejected and we pay no tip.
#
# Why dual-submit: Jito has had multi-hour outages. Helius parallel-path is
# insurance against missed trades during Jito downtime.
#
# Cost math: 100k lamports = 0.0001 SOL ≈ $0.01 per trade. On 19 trades today
# that would have been ~$0.20 total in tips.

# ⚡ MCAP WATCHER — Vex's pre-graduation band-crossing detector (2026-05-14).
# When a token is rejected for low_mcap, it gets enrolled here. The watcher
# subscribes to per-mint trade events and re-fires the entry pipeline when
# the token's mcap CROSSES INTO the [min_market_cap_usd, max_market_cap_usd]
# band. This is how we catch coins like Singularity that launch at $3k and
# rocket to $16k+ (which our normal new-token stream misses).
[mcap_watcher]
enabled = false                   # 🚫 2026-05-22 — disabled by Mamba. COPY-TRADE ONLY — no sniper/climber routes.
ttl_secs = 900                    # 🐍 15min — climbers pump fast or not at all
max_candidates = 1500             # 🐍 bumped from 500 — was hitting cap


# 📈 TRENDING POLLER (2026-05-18). Polls pump.fun's coins endpoint sorted by
# last_trade_timestamp to catch coins (incl. graduated ones on pumpswap/Raydium)
# that the WS new-token subscription missed. This is what catches "Sunny"-style
# coins that pumped in our band before the bot started watching.
[trending_poller]
enabled = false                   # 🚫 2026-05-22 — disabled by Mamba. COPY-TRADE ONLY.
poll_interval_secs = 30
min_mcap_usd = 15000.0
max_mcap_usd = 200000.0
min_age_secs = 30
max_age_secs = 2592000           # 🐍 30 days — old graduates with engagement are valid
skip_nsfw = true
allow_graduated = true            # the whole point
fetch_limit = 300                # 🐍 paginate to 300 (was 100)
dedup_cap = 5000
min_reply_count = 5              # 🐍 lowered 20→5 (was killing fresh rockets)
require_social = false           # 🐍 NEW — twitter/telegram required (false for now)
max_last_trade_age_secs = 10    # 🐍 tightened — only truly active coins


# 🐍 VOLUME VERIFIER (2026-05-18) — hits Dexscreener for real 5min volume +
# buy/sell tx counts before letting bot enter. Catches "zombies" that look
# active via pump.fun's last_trade_timestamp but have $0 actual movement.
[volume_verifier]
enabled = false                   # 🚫 2026-05-22 — only relevant for sniper path. COPY-TRADE ONLY.
min_vol_5m_usd = 1000.0           # v2 Mamba spec
min_txns_5m = 15                  # 🐍 loosened slightly
min_buy_sell_ratio = 1.05         # 🐍 lowered 1.2→1.05 (would have caught August)
min_liquidity_usd = 0.0           # 🐍 disabled — pre-grad coins have no AMM liq
cache_ttl_secs = 30               # cache results per mint 30s
request_timeout_secs = 5
trending_only = true              # 🐍 only verify post-traction routes

[jito]
enabled = true                            # 🔴 default off — flip to true after dust-testing.
endpoint = "https://mainnet.block-engine.jito.wtf"
tip_lamports = 100_000                    # 0.0001 SOL = ~$0.01 (conservative)
tip_max_lamports = 2_000_000              # hard cap: 0.002 SOL = ~$0.20 (refuses startup above)
dual_submit = true                        # also submit to Helius. Recommended TRUE.

[storage]
db_path = "data/sniper.db"
state_path = "data/state.json"
log_dir = "logs"

