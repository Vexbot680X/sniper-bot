# ============================================================================
# Mirrors buys of target smart-money wallets. Primary: Gake.
# Helius API key MUST be set via HELIUS_API_KEY env var — never in this file.
#
# HARD RULE (Mamba 2026-05-11, MEMORY.md): NEVER mirror target's trade size.
# Sizing comes from `trading.live_max_position_sol` above. min_copy_usd is
# the filter on HIS size (skip his dust); our own size is independent.
[copy_trader]
enabled = true
poll_interval_secs = 2                # 🚀 2026-05-22 16:20 Mamba: Helius Business plan unlocks high-RPS polling. Dropped 7s→2s. Cuts copy-trade latency from ~7s avg to ~2s avg. Cost: 3 targets × (60/2) = 90 RPM to Helius, well within Business limits.
min_copy_usd = 20.0    # 2026-05-22 — Theo-only mode. His median buy is ~$23; filter out his sub-dust probes. Raise to 50+ to catch only conviction plays.
fetch_limit = 20         # last N txs per poll per wallet
# 🚨 SIGNAL FLOOD FIX (2026-05-21): ring is shared across ALL targets. With
# 15 wallets * 20 fetch_limit = 300 sigs/cycle, the old 256 cap overflowed
# every poll and re-emitted evicted sigs as "new" (7-8x amplification).
# Code also enforces a floor of `targets * fetch_limit * 16` defensively.
dedup_cap = 8192

# 🧠 HYPE GATE (v1, observe-only): on every BUY signal we call
# hype::get_hype_score(mint) with a 200ms timeout. In "observe" mode the
# result is logged (PASS/FAIL vs hype_min_score) but NEVER blocks a trade.
# Phase 4 will flip hype_gate_mode = "enforce" once the hype sources are wired.
# A hype-skill timeout (>200ms) is treated as PASS — don't block trades on a
# broken hype service.
hype_min_score = 0.0     # v1 threshold (0.0 means "every score passes")
hype_gate_mode = "observe"  # "observe" | "enforce"

