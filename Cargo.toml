[package]
name = "sniper-bot"
version = "0.2.0"
edition = "2021"
authors = ["Vex <vex@familiar>"]
description = "Solana pump.fun sniper bot — paper + live trading"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"  # added 2026-05-14 for mcap_watcher::SolUsdProvider trait.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
bs58 = "0.5"
rand = "0.8"
config = "0.14"
toml = "0.8"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
shellexpand = "3"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }

# Live execution layer.
# Vendored openssl avoids the need for system libssl-dev/pkg-config.
# pumpfun crate handles instruction building, ATA mgmt, slippage, tx submission.
# default features re-enabled: include `create-ata` (prepends create_associated_token_account
# idempotent for the BUYER's ATA when missing) and `close-ata` (closes empty ATA after sell).
# Disabling these caused the 2026-05-08 live failure path; see LIVE_BUG_FIX_REPORT.md.
pumpfun = { version = "4.6.0" }
solana-sdk = "2"
solana-rpc-client = "2"
solana-rpc-client-api = "2"
solana-transaction-status = "2"
spl-associated-token-account = "6"
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Slim dev / test profiles — saves ~5GB of disk and avoids OOM on this small VM.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
