[package]
name = "sniper-bot"
version = "0.1.0"
edition = "2021"
authors = ["Vex <vex@familiar>"]
description = "Solana pump.fun sniper bot — paper trading mode"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
# solana-sdk only needed for live trading (signing); paper mode skips it.
# bs58 / rand kept for future wallet ops.
bs58 = "0.5"
rand = "0.8"
config = "0.14"
toml = "0.8"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
